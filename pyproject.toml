[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-auditor"
version = "0.2.0"
description = "Auditor SEO sencillo: rastrea un sitio, aplica comprobaciones en código y calcula una nota reproducible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guille" }]
keywords = ["seo", "auditoria", "crawler", "cli"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<7",
]

[project.urls]
Repository = "https://github.com/Guille6520/seo-auditor"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
seo-auditor = "seo_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # la longitud de línea la cuida el formato, no el linter
